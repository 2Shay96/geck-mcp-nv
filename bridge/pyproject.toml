[project]
name = "geck-bridge-mcp"
version = "0.2.0"
description = "Project-scoped Model Context Protocol tools for Fallout New Vegas GECK"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "pillow==12.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
# sprite_flipbook.py and tools/creature_skeleton.py; PyFFI imports distutils, which Python 3.12 removed
sprites = ["PyFFI==2.2.3", "setuptools==84.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
