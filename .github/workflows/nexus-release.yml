name: Nexus release

# Deliberate dispatch only: GitHub releases and pushes never upload to Nexus.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check authentication, or publish a checked release asset
        type: choice
        options: [check, publish]
        default: check
      tag:
        description: Existing GitHub release tag (publish only, e.g. v0.4.0)
        type: string
      sha256:
        description: Approved ZIP SHA256 (publish only)
        type: string
      description:
        description: Nexus file description (publish only)
        type: string
      archive_previous:
        description: Archive the previous Nexus version when publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nexus-release
  cancel-in-progress: false

jobs:
  nexus:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Nexus authentication and target
        env:
          NEXUS_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get('NEXUS_KEY', '')
          if not key:
              raise SystemExit('Add repository Actions secret NEXUSMODS_API_KEY first.')
          def get(path):
              request = urllib.request.Request('https://api.nexusmods.com/v3' + path,
                  headers={'apikey': key, 'User-Agent': 'geck-mcp-nv-release'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)['data']
              except urllib.error.HTTPError as exc:
                  raise SystemExit('Nexus authentication/target check failed: HTTP ' + str(exc.code)) from None
          mod = get('/games/newvegas/mods/99851')
          if str(mod['id']) != '558345848331':
              raise SystemExit('Unexpected Nexus mod ID; inspect target before publishing.')
          file = get('/mod-files/8079429')
          if str(file['id']) != '8079429' or file['name'] != 'GECK MCP for New Vegas':
              raise SystemExit('Unexpected Nexus file; inspect target before publishing.')
          print('Authenticated reads succeeded for GECK MCP for New Vegas. No upload performed by this check.')
          PY
      - name: Fetch and verify the approved GitHub release ZIP
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          FILE_DESCRIPTION: ${{ inputs.description }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          tag, expected = os.environ['RELEASE_TAG'], os.environ['EXPECTED_SHA256'].lower()
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Use an existing stable release tag such as v0.4.0.')
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('An approved SHA256 is required.')
          if not os.environ['FILE_DESCRIPTION'].strip():
              raise SystemExit('Supply the prepared Nexus file description.')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,isPrerelease']))
          if release['isDraft'] or release['isPrerelease']:
              raise SystemExit('Publish a checked stable GitHub release first.')
          version = tag[1:]
          filename = 'GECK-MCP-for-New-Vegas-' + version + '.zip'
          subprocess.run(['gh', 'release', 'download', tag, '--pattern', filename], check=True)
          blob = pathlib.Path(filename).read_bytes()
          if hashlib.sha256(blob).hexdigest() != expected:
              raise SystemExit('Release asset SHA256 differs; nothing uploaded to Nexus.')
          with zipfile.ZipFile(filename) as archive:
              if archive.testzip():
                  raise SystemExit('Release ZIP integrity failure.')
              import tomllib
              package_version = tomllib.loads(archive.read('GECK-MCP-for-New-Vegas/bridge/pyproject.toml').decode())['project']['version']
              if package_version != version:
                  raise SystemExit('Archive version differs from release tag.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_VERSION=' + version + '\nRELEASE_FILE=' + filename + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Verified GitHub asset: ' + filename + '\n\nSHA256: ' + expected + '\n')
          PY
      - name: Publish successor to the existing Nexus file
        if: inputs.mode == 'publish'
        id: upload
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: '8079429'
          filename: ${{ env.RELEASE_FILE }}
          version: ${{ env.RELEASE_VERSION }}
          display_name: GECK MCP for New Vegas
          description: ${{ inputs.description }}
          category: main
          allow_mod_manager_download: 'false'
          primary_mod_manager_download: 'false'
          show_requirements_pop_up: 'false'
          update_mod_version: 'true'
          archive_existing_version: ${{ inputs.archive_previous }}
      - name: Record publication receipt
        if: success() && inputs.mode == 'publish'
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\nCreated Nexus version ID: ' + os.environ['VERSION_ID'] + '\n\n')
              output.write('Target: https://www.nexusmods.com/newvegas/mods/99851?tab=files\n\n')
              output.write('Mod-manager downloads disabled. Check public listing and virus scan separately.\n')
          PY
