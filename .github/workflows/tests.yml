name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      matrix:
        # windows-latest added once the bridge tests are made path-agnostic (they assume POSIX paths today)
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .
      - run: python -m unittest discover -s . -p test_esp_check.py -v
  windows-port:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
