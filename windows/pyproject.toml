[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geck-mcp-nv"
version = "0.1.0.dev0"
description = "MCP server for automating the Fallout: New Vegas G.E.C.K. editor (port of the Fallout 3 GECK MCP)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "maksimka2432fr23"}, {name = "2Shay (FNV port)"}]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12.4",
  "pillow>=10",
  "psutil>=5.9",
  "pywinauto>=0.6.8",
]

[project.scripts]
geck-mcp-nv = "geck_mcp_nv.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Upstream = "https://github.com/maksimka2432fr23/codex-skill-mcp-fallout3"
